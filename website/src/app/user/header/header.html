<header class="liquid-header">

  <!-- Logo -->
  <div class="logo-container">
    <img src="https://cgclerp.in/Images/DEFAULT_BG/default_logo1.png" alt="College Logo">
  </div>

  <!-- Navigation -->
  <nav class="nav-menu">

    <a routerLink="/home"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      <i class="bi bi-grid"></i>
      <span>Home</span>
    </a>

    <a routerLink="/submit"
       routerLinkActive="active">
      <i class="bi bi-plus-circle"></i>
      <span>Submit Complaint</span>
    </a>

    <a routerLink="/complaint"
       routerLinkActive="active">
      <i class="bi bi-file-earmark-text"></i>
      <span>My Complaints</span>
    </a>

    <a routerLink="/track"
       routerLinkActive="active">
      <i class="bi bi-geo-alt"></i>
      <span>Track Complaint</span>
    </a>

  </nav>


  <!-- Right Section -->
  <div class="header-actions">

    <!-- Notification -->
    <button class="glass-icon" routerLink="/user/notifications">

      <i class="bi bi-bell"></i>

      <span class="notification-dot"></span>

    </button>


    <!-- Profile -->
    <button class="profile-button" routerLink="/profile">

      <span class="profile-avatar">
        <i class="bi bi-person"></i>
      </span>

      <span class="profile-name">
        Profile
      </span>

      <i class="bi bi-chevron-down arrow"></i>

    </button>

  </div>

</header>
