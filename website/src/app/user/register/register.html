<div class="register-page">

  <!-- Decorative Background -->
  <div class="bg-circle circle-one"></div>
  <div class="bg-circle circle-two"></div>


  <!-- Register Card -->
  <div class="register-card">

    <!-- Logo -->
    <div class="logo-container">

      <!-- Replace with your college logo -->
      <div class="logo-placeholder">
        <i class="bi bi-building"></i>
      </div>

    </div>


    <!-- Heading -->
    <div class="register-heading">

      <span class="register-label">
        Student Portal
      </span>

      <h1>Create Account</h1>

      <p>
        Register to submit and track your complaints
      </p>

    </div>


    <!-- Registration Form -->
    <form class="register-form" (ngSubmit)="submit()" #registerForm="ngForm">


      <!-- Student Name -->
      <div class="form-row">

        <div class="form-group">

          <label for="firstName">
            First Name
          </label>

          <div class="input-wrapper">

            <i class="bi bi-person"></i>

            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="firstName"
              placeholder="First name"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="lastName">
            Last Name
          </label>

          <div class="input-wrapper">

            <i class="bi bi-person"></i>

            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="lastName"
              placeholder="Last name"
              required
            >

          </div>

        </div>

      </div>


      <!-- Student ID -->
      <div class="form-group">

        <label for="studentId">
          Student ID
        </label>

        <div class="input-wrapper">

          <i class="bi bi-card-text"></i>

          <input
            type="text"
            id="studentId"
            name="studentId"
            [(ngModel)]="studentId"
            placeholder="Enter your student ID"
            required
          >

        </div>

      </div>


      <!-- Email -->
      <div class="form-group">

        <label for="email">
          College Email
        </label>

        <div class="input-wrapper">

          <i class="bi bi-envelope"></i>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your college email"
            required
          >

        </div>

      </div>


      <!-- Department and Semester -->
      <div class="form-row">

        <div class="form-group">

          <label for="department">
            Department
          </label>

          <div class="input-wrapper select-wrapper">

            <i class="bi bi-diagram-3"></i>

            <select
              id="department"
              name="department"
              [(ngModel)]="department"
              required>

              <option value="" selected disabled>
                Select department
              </option>

              <option value="cse">
                Computer Science & Engineering
              </option>

              <option value="ece">
                Electronics & Communication
              </option>

              <option value="me">
                Mechanical Engineering
              </option>

              <option value="ce">
                Civil Engineering
              </option>

              <option value="ee">
                Electrical Engineering
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label for="semester">
            Semester
          </label>

          <div class="input-wrapper select-wrapper">

            <i class="bi bi-calendar3"></i>

            <select
              id="semester"
              name="semester"
              [(ngModel)]="semester"
              required>

              <option value="" selected disabled>
                Semester
              </option>

              <option value="1">1st</option>
              <option value="2">2nd</option>
              <option value="3">3rd</option>
              <option value="4">4th</option>
              <option value="5">5th</option>
              <option value="6">6th</option>
              <option value="7">7th</option>
              <option value="8">8th</option>

            </select>

          </div>

        </div>

      </div>


      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <i class="bi bi-lock"></i>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            minlength="8"
            placeholder="Create a password"
            required
          >

          <button
            type="button"
            class="password-toggle">

            <i class="bi bi-eye"></i>

          </button>

        </div>

      </div>


      <!-- Confirm Password -->
      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <div class="input-wrapper">

          <i class="bi bi-shield-lock"></i>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            required
          >

          <button
            type="button"
            class="password-toggle">

            <i class="bi bi-eye"></i>

          </button>

        </div>

      </div>


      <!-- Terms -->
      <div class="terms-row">

        <label class="terms-label">

          <input
            type="checkbox"
            required
          >

          <span class="custom-checkbox"></span>

          <span>
            I agree to the
            <a href="#">Terms & Conditions</a>
          </span>

        </label>

      </div>


      <!-- Register Button -->
      <p *ngIf="error" class="form-error" role="alert">{{ error }}</p>
      <p *ngIf="success" class="form-success" role="status">{{ success }}</p>
      <button
        type="submit"
        class="register-btn" [disabled]="loading || !registerForm.valid">

        <span>{{ loading ? 'Creating account…' : 'Create Account' }}</span>

        <i class="bi bi-arrow-right"></i>

      </button>

    </form>


    <!-- Login -->
    <div class="login-section">

      <p>
        Already have an account?
      </p>

      <a
        routerLink="/login"
        class="login-link">

        Sign In

        <i class="bi bi-arrow-up-right"></i>

      </a>

    </div>


    <!-- Footer -->
    <div class="register-footer">

      <i class="bi bi-shield-check"></i>

      <span>
        Your information is securely protected
      </span>

    </div>

  </div>

</div>
